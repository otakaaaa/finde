<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <!-- Glossy metallic gray: bright silver at top → dark mid → slight lift at bottom -->
    <linearGradient id="gloss" x1="0" y1="4" x2="0" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#f4f4f4"/>
      <stop offset="28%"  stop-color="#d0d0d0"/>
      <stop offset="62%"  stop-color="#7a7a7a"/>
      <stop offset="100%" stop-color="#b0b0b0"/>
    </linearGradient>
  </defs>

  <!-- Black background -->
  <rect width="32" height="32" fill="#0c0c0c"/>

  <!-- F: left vert + top bar + mid bar -->
  <rect x="5"  y="4"  width="7"  height="24" fill="url(#gloss)"/>
  <rect x="5"  y="4"  width="22" height="7"  fill="url(#gloss)"/>
  <rect x="5"  y="16" width="16" height="6"  fill="url(#gloss)"/>
</svg>
