<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登録を完了してください</title>
</head>
<body style="margin:0;padding:0;background-color:#f5f5f5;font-family:'Helvetica Neue',Arial,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background-color:#f5f5f5;padding:40px 16px;">
    <tr>
      <td align="center">
        <table width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background-color:#ffffff;">

          <!-- ヘッダー -->
          <tr>
            <td style="background-color:#1a1a1a;padding:32px 40px;">
              <p style="margin:0;font-size:11px;font-weight:900;letter-spacing:0.5em;text-transform:uppercase;color:rgba(255,255,255,0.4);">FINDE</p>
            </td>
          </tr>

          <!-- 本文 -->
          <tr>
            <td style="padding:48px 40px 40px;">
              <h1 style="margin:0 0 8px;font-size:22px;font-weight:900;letter-spacing:-0.03em;color:#1a1a1a;">FINDEへようこそ。</h1>
              <p style="margin:0 0 32px;font-size:11px;font-weight:700;letter-spacing:0.3em;text-transform:uppercase;color:rgba(0,0,0,0.25);">Welcome to FINDE</p>

              <p style="margin:0 0 24px;font-size:14px;line-height:1.8;color:#444444;">
                あなたにぴったりのセレクトショップや古着屋が、<br />
                きっと見つかります。<br /><br />
                以下の6桁のコードをFINDEの認証画面に入力して、<br />
                登録を完了してください。コードの有効期限は1時間です。
              </p>

              <!-- 認証コード -->
              <table cellpadding="0" cellspacing="0" style="margin:0 0 32px;">
                <tr>
                  <td style="background-color:#f5f5f5;border:1px solid #e0e0e0;padding:24px 48px;">
                    <p style="margin:0;font-size:36px;font-weight:900;letter-spacing:0.4em;color:#1a1a1a;text-align:center;">{{ .Token }}</p>
                  </td>
                </tr>
              </table>

              <p style="margin:0;font-size:12px;line-height:1.8;color:#aaaaaa;">
                このコードは1時間で期限切れになります。<br />
                心当たりがない場合は、このメールを無視してください。
              </p>
            </td>
          </tr>

          <!-- 区切り線 -->
          <tr>
            <td style="padding:0 40px;">
              <div style="border-top:1px solid #eeeeee;"></div>
            </td>
          </tr>

          <!-- フッター -->
          <tr>
            <td style="padding:24px 40px 32px;">
              <p style="margin:0;font-size:11px;line-height:1.7;color:#bbbbbb;">
                このメールに心当たりがない場合は、無視していただいて構いません。<br />
                ご不明な点は <a href="{{ .SiteURL }}" style="color:#888888;">FINDE</a> までお問い合わせください。
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
