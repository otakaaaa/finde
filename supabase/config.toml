# 詳細な設定リファレンスについては以下を参照:
# https://supabase.com/docs/guides/local-development/cli/config
# 同一ホスト上の異なる Supabase プロジェクトを区別するための文字列。
# `supabase init` 実行時のカレントディレクトリ名がデフォルト値。
project_id = "finde"

[api]
enabled = true
# API URL に使用するポート。
port = 54321
# API に公開するスキーマ。このスキーマのテーブル・ビュー・ストアドプロシージャが
# API エンドポイントとして公開される。`public` と `graphql_public` はデフォルトで含まれる。
schemas = ["public", "graphql_public"]
# すべてのリクエストの search_path に追加する追加スキーマ。
extra_search_path = ["public", "extensions"]
# ビュー・テーブル・ストアドプロシージャから返される最大行数。
# 意図しないリクエストや悪意あるリクエストによるペイロードサイズを制限する。
max_rows = 1000

[api.tls]
# 自己署名証明書を使用してローカルで HTTPS エンドポイントを有効化する。
enabled = false
# 自己署名証明書ペアのパス。
# cert_path = "../certs/my-cert.pem"
# key_path = "../certs/my-key.pem"

[db]
# ローカルデータベース URL に使用するポート。
port = 54322
# db diff コマンドでシャドウデータベースを初期化する際に使用するポート。
shadow_port = 54320
# ローカルデータベース起動時のヘルスチェックの最大待機時間。
health_timeout = "2m"
# 使用するデータベースのメジャーバージョン。リモートデータベースと同じにする必要がある。
# リモートデータベースで `SHOW server_version;` を実行して確認すること。
major_version = 17

[db.pooler]
enabled = false
# ローカル接続プーラーに使用するポート。
port = 54329
# サーバー接続を他のクライアントが再利用できるタイミングを指定する。
# サポートされているプーラーモード: `transaction`、`session`。
pool_mode = "transaction"
# ユーザー/データベースペアごとに許可するサーバー接続数。
default_pool_size = 20
# 許可するクライアント接続の最大数。
max_client_conn = 100

# [db.vault]
# secret_key = "env(SECRET_VALUE)"

[db.migrations]
# 無効にすると、db push や reset 時にマイグレーションがスキップされる。
enabled = true
# データベースのスキーマを記述したスキーマファイルの順序付きリストを指定する。
# supabase ディレクトリからの相対グロブパターンをサポート: "./schemas/*.sql"
schema_paths = []

[db.seed]
# 有効にすると、db reset 時にマイグレーション後にデータベースにシードデータが投入される。
enabled = true
# db reset 時に読み込むシードファイルの順序付きリストを指定する。
# supabase ディレクトリからの相対グロブパターンをサポート: "./seeds/*.sql"
sql_paths = ["./seed.sql"]

[db.network_restrictions]
# ネットワーク制限の管理を有効化する。
enabled = false
# データベースへの接続を許可する IPv4 CIDR ブロックのリスト。
# デフォルトはすべての IPv4 接続を許可。空配列にするとすべての IP をブロック。
allowed_cidrs = ["0.0.0.0/0"]
# データベースへの接続を許可する IPv6 CIDR ブロックのリスト。
# デフォルトはすべての IPv6 接続を許可。空配列にするとすべての IP をブロック。
allowed_cidrs_v6 = ["::/0"]

# データベースへの非セキュア接続を拒否する場合はコメントを外す。
# [db.ssl_enforcement]
# enabled = true

[realtime]
enabled = true
# IPv4 または IPv6 で Realtime をバインドする。（デフォルト: IPv4）
# ip_version = "IPv6"
# HTTP リクエストヘッダーの最大バイト長。（デフォルト: 4096）
# max_header_length = 4096

[studio]
enabled = true
# Supabase Studio に使用するポート。
port = 54323
# フロントエンドが接続する API サーバーの外部 URL。
api_url = "http://127.0.0.1"
# Supabase Studio の Supabase AI に使用する OpenAI API キー。
openai_api_key = "env(OPENAI_API_KEY)"

# メールテストサーバー。ローカル開発環境で送信されたメールは実際には送信されず、
# 監視されるため、Web インターフェースから送信予定のメールを確認できる。
[inbucket]
enabled = true
# メールテストサーバーの Web インターフェースに使用するポート。
port = 54324
# メールを送信するユーザーアプリケーションのテスト用に追加ポートを公開する場合はコメントを外す。
# smtp_port = 54325
# pop3_port = 54326
# admin_email = "admin@email.com"
# sender_name = "Admin"

[storage]
enabled = true
# 許可される最大ファイルサイズ（例: "5MB"、"500KB"）。
file_size_limit = "50MiB"

# ローカルストレージバケットを設定する場合はコメントを外す
# [storage.buckets.images]
# public = false
# file_size_limit = "50MiB"
# allowed_mime_types = ["image/png", "image/jpeg"]
# objects_path = "./images"

[storage.buckets."shop-photos"]
public = true
file_size_limit = "10MiB"
allowed_mime_types = ["image/jpeg", "image/png", "image/webp"]

# S3 互換クライアント経由での接続を許可する
[storage.s3_protocol]
enabled = true

# 画像変換 API は Supabase Pro プランで利用可能。
# [storage.image_transformation]
# enabled = true

# Iceberg カタログ経由で ETL ジョブを実行するために分析データを S3 に保存する
# この機能はホスト型プラットフォームでのみ利用可能。
[storage.analytics]
enabled = false
max_namespaces = 5
max_tables = 10
max_catalogs = 2

# Analytics Buckets は Supabase Pro プランで利用可能。
# [storage.analytics.buckets.my-warehouse]

# 大規模で耐久性の高いデータセット用にベクター埋め込みを S3 に保存する
# この機能はホスト型プラットフォームでのみ利用可能。
[storage.vector]
enabled = false
max_buckets = 10
max_indexes = 5

# Vector Buckets は Supabase Pro プランで利用可能。
# [storage.vector.buckets.documents-openai]

[auth]
enabled = true
# ウェブサイトのベース URL。リダイレクトの許可リストおよびメールで使用する
# URL の構築に使用される。
site_url = "http://localhost:5174"
# 認証後にリダイレクトが許可される*完全一致* URL のリスト。
additional_redirect_urls = ["http://localhost:5174", "https://finde.com"]
# トークンの有効期間（秒）。デフォルトは 3600（1時間）、最大 604,800（1週間）。
jwt_expiry = 3600
# JWT 発行者 URL。未設定の場合、ローカル API URL（http://127.0.0.1:<port>/auth/v1）がデフォルト。
# jwt_issuer = ""
# JWT 署名キーのパス。署名キーファイルを git にコミットしないこと。
# signing_keys_path = "./signing_keys.json"
# 無効にすると、リフレッシュトークンが期限切れにならない。
enable_refresh_token_rotation = true
# リフレッシュトークンを期限切れ後も指定秒数内であれば再利用できるようにする。
# enable_refresh_token_rotation = true が必要。
refresh_token_reuse_interval = 10
# プロジェクトへの新規ユーザーサインアップを許可/禁止する。
enable_signup = true
# プロジェクトへの匿名サインインを許可/禁止する。
enable_anonymous_sign_ins = false
# アカウントの手動リンクのテストを許可/禁止する。
enable_manual_linking = true
# この値より短いパスワードは脆弱として拒否される。最小 6、推奨 8 以上。
minimum_password_length = 6
# 以下の要件を満たさないパスワードは脆弱として拒否される。サポートされる値:
# `letters_digits`、`lower_upper_letters_digits`、`lower_upper_letters_digits_symbols`
password_requirements = ""

[auth.rate_limit]
# 1時間あたりに送信できるメール数。auth.email.smtp の有効化が必要。
email_sent = 2
# 1時間あたりに送信できる SMS メッセージ数。auth.sms の有効化が必要。
sms_sent = 30
# IP アドレスごとに1時間あたり許可される匿名サインイン数。enable_anonymous_sign_ins = true が必要。
anonymous_users = 30
# IP アドレスごとに5分間隔でリフレッシュできるセッション数。
token_refresh = 150
# IP アドレスごとに5分間隔で許可されるサインアップ・サインインリクエスト数（匿名ユーザーを除く）。
sign_in_sign_ups = 30
# IP アドレスごとに5分間隔で許可される OTP / マジックリンク検証数。
token_verifications = 30
# IP アドレスごとに5分間隔で許可される Web3 ログイン数。
web3 = 30

# サポートされているキャプチャプロバイダーを設定する: `hcaptcha`、`turnstile`。
# [auth.captcha]
# enabled = true
# provider = "hcaptcha"
# secret = ""

[auth.email]
# プロジェクトへのメールによる新規ユーザーサインアップを許可/禁止する。
enable_signup = true
# 有効にすると、メールアドレス変更時に旧メールアドレスと新メールアドレスの両方での確認が必要になる。
# 無効にすると、新しいメールアドレスのみで確認が必要。
double_confirm_changes = true
# 有効にすると、ユーザーはサインイン前にメールアドレスを確認する必要がある。
enable_confirmations = true
# 有効にすると、ユーザーはパスワードを変更するために再認証するか、最近ログインしている必要がある。
secure_password_change = false
# 次のサインアップ確認メールまたはパスワードリセットメールを送信するまでの最短待機時間。
max_frequency = "1s"
# メール OTP に使用する文字数。
otp_length = 6
# メール OTP の有効期限（秒）。デフォルトは 1 時間。
otp_expiry = 3600

# 本番環境対応の SMTP サーバーを使用する場合はコメントを外す
# [auth.email.smtp]
# enabled = true
# host = "smtp.sendgrid.net"
# port = 587
# user = "apikey"
# pass = "env(SENDGRID_API_KEY)"
# admin_email = "admin@email.com"
# sender_name = "Admin"

# アカウント登録時の確認メールテンプレート
[auth.email.template.confirm_signup]
subject = "【FINDE】登録を完了してください"
content_path = "./supabase/templates/confirm_signup.html"

# パスワードリセットメールテンプレート
[auth.email.template.recovery]
subject = "【FINDE】パスワードリセットのご案内"
content_path = "./supabase/templates/recovery.html"

# メールテンプレートをカスタマイズする場合はコメントを外す
# [auth.email.template.invite]
# subject = "You have been invited"
# content_path = "./supabase/templates/invite.html"

# 通知メールテンプレートをカスタマイズする場合はコメントを外す
# [auth.email.notification.password_changed]
# enabled = true
# subject = "Your password has been changed"
# content_path = "./templates/password_changed_notification.html"

[auth.sms]
# プロジェクトへの SMS による新規ユーザーサインアップを許可/禁止する。
enable_signup = false
# 有効にすると、ユーザーはサインイン前に電話番号を確認する必要がある。
enable_confirmations = false
# ユーザーへの OTP 送信テンプレート。
template = "Your code is {{ .Code }}"
# 次の SMS OTP を送信するまでの最短待機時間。
max_frequency = "5s"

# テスト用に電話番号と OTP の定義済みマッピングを使用する場合はコメントを外す。
# [auth.sms.test_otp]
# 4152127777 = "123456"

# ログイン済みセッションのタイムアウトを設定する場合はコメントを外す。
# [auth.sessions]
# 指定した期間後に強制ログアウトする。
# timebox = "24h"
# 指定した期間より長くユーザーが非アクティブな場合に強制ログアウトする。
# inactivity_timeout = "8h"

# このフックは新規ユーザー作成前に実行され、受信したユーザーオブジェクトに基づいてリクエストを拒否できる。
# [auth.hook.before_user_created]
# enabled = true
# uri = "pg-functions://postgres/auth/before-user-created-hook"

# このフックはトークン発行前に実行され、使用された認証方法に基づいて追加クレームを付与できる。
# [auth.hook.custom_access_token]
# enabled = true
# uri = "pg-functions://<database>/<schema>/<hook_name>"

# サポートされている SMS プロバイダーを設定する: `twilio`、`twilio_verify`、`messagebird`、`textlocal`、`vonage`。
[auth.sms.twilio]
enabled = false
account_sid = ""
message_service_sid = ""
# Twilio の認証トークンを git にコミットしないこと。環境変数による置換を使用すること:
auth_token = "env(SUPABASE_AUTH_SMS_TWILIO_AUTH_TOKEN)"

# 多要素認証は Supabase Pro プランで利用可能。
[auth.mfa]
# ユーザーごとに同時に登録できる MFA 要素の数を制御する。
max_enrolled_factors = 10

# アプリ認証（TOTP）による MFA を制御する
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# 電話メッセージによる MFA を設定する
[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false
otp_length = 6
template = "Your code is {{ .Code }}"
max_frequency = "5s"

# WebAuthn による MFA を設定する場合はコメントを外す
# [auth.mfa.web_authn]
# enroll_enabled = true
# verify_enabled = true

# 外部 OAuth プロバイダーを使用する。サポートされているプロバイダーの一覧:
# `apple`、`azure`、`bitbucket`、`discord`、`facebook`、`github`、`gitlab`、`google`、
# `keycloak`、`linkedin_oidc`、`notion`、`twitch`、`twitter`、`x`、`slack`、`spotify`、`workos`、`zoom`。
[auth.external.apple]
enabled = false
client_id = ""
# OAuth プロバイダーのシークレットを git にコミットしないこと。環境変数による置換を使用すること:
secret = "env(SUPABASE_AUTH_EXTERNAL_APPLE_SECRET)"
# デフォルトの auth リダイレクト URL を上書きする。
redirect_uri = ""
# デフォルトの auth プロバイダー URL を上書きする。セルフホスト GitLab、シングルテナント Azure、
# またはその他のサードパーティ OIDC プロバイダーのサポートに使用する。
url = ""
# 有効にすると、nonce チェックがスキップされる。ローカルでの Google 認証サインインに必要。
skip_nonce_check = false
# 有効にすると、プロバイダーがメールアドレスを返さない場合でもユーザーが正常に認証できる。
email_optional = false

[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
redirect_uri = ""
skip_nonce_check = true

# Solana ウォレット保有者が Sign in with Solana（SIWS、EIP-4361）標準でプロジェクトにサインインできるようにする。
# [auth.rate_limit] セクションで "web3" レートリミットを設定し、セルフホストの場合は [auth.captcha] を設定できる。
[auth.web3.solana]
enabled = false

# Firebase Auth をサードパーティプロバイダーとして Supabase Auth と併用する。
[auth.third_party.firebase]
enabled = false
# project_id = "my-firebase-project"

# Auth0 をサードパーティプロバイダーとして Supabase Auth と併用する。
[auth.third_party.auth0]
enabled = false
# tenant = "my-auth0-tenant"
# tenant_region = "us"

# AWS Cognito（Amplify）をサードパーティプロバイダーとして Supabase Auth と併用する。
[auth.third_party.aws_cognito]
enabled = false
# user_pool_id = "my-user-pool-id"
# user_pool_region = "us-east-1"

# Clerk をサードパーティプロバイダーとして Supabase Auth と併用する。
[auth.third_party.clerk]
enabled = false
# https://clerk.com/setup/supabase から取得する
# domain = "example.clerk.accounts.dev"

# OAuth サーバー設定
[auth.oauth_server]
# OAuth サーバー機能を有効化する
enabled = false
# OAuth 同意フロー UI のパス
authorization_url_path = "/oauth/consent"
# 動的クライアント登録を許可する
allow_dynamic_registration = false

[functions.stripe-webhook]
verify_jwt = false

[edge_runtime]
enabled = true
# サポートされているリクエストポリシー: `oneshot`、`per_worker`。
# `per_worker`（デフォルト）— ローカル開発中のホットリロードを有効化する。
# `oneshot` — ホットリロードで問題が発生する場合のフォールバックモード（大規模リポジトリやシンボリックリンクなど）。
policy = "per_worker"
# エッジ関数のデバッグ用に Chrome インスペクターをアタッチするポート。
inspector_port = 8083
# 使用する Deno のメジャーバージョン。
deno_version = 2

# [edge_runtime.secrets]
# secret_key = "env(SECRET_VALUE)"

[analytics]
enabled = true
port = 54327
# サポートされているバックエンドを設定する: `postgres`、`bigquery`。
backend = "postgres"

# 実験的な機能はいつでも廃止される可能性がある
[experimental]
# OrioleDB（S3）を使用するように Postgres ストレージエンジンを設定する
orioledb_version = ""
# S3 バケット URL を設定する（例: <bucket_name>.s3-<region>.amazonaws.com）
s3_host = "env(S3_HOST)"
# S3 バケットのリージョンを設定する（例: us-east-1）
s3_region = "env(S3_REGION)"
# S3 バケットの AWS_ACCESS_KEY_ID を設定する
s3_access_key = "env(S3_ACCESS_KEY)"
# S3 バケットの AWS_SECRET_ACCESS_KEY を設定する
s3_secret_key = "env(S3_SECRET_KEY)"

# [experimental.pgdelta]
# 有効にすると、サポートされているスキーマフローで pg-delta がアクティブエンジンになる。
# enabled = false
# 宣言型ファイルが書き込まれる `supabase/` 配下のディレクトリ。
# declarative_schema_path = "./declarative"
# pg-delta SQL フォーマットに渡される JSON 文字列。
# format_options = "{\"keywordCase\":\"upper\",\"indent\":2,\"maxWidth\":80,\"commaStyle\":\"trailing\"}"
